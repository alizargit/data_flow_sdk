<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Flow SDK</title>
  <style>
    :root { --bg: #f7f7f5; --fg: #1f2933; --muted: #616e7c; --link: #2f5fa7; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14171a; --fg: #e4e7eb; --muted: #9aa5b1; --link: #8fb4ec; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg);
           font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    p { color: var(--muted); }
    a { color: var(--link); }
    code { font: 14px ui-monospace, Menlo, Consolas, monospace; }
    footer { margin-top: 48px; font-size: .85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Data Flow SDK</h1>
    <p>Lets a Puter app send its users' data into their own Data Flow, with their consent.</p>
    <p>Import <code>/v1/dataflow-connect.js</code> as a module, after puter.js.
       See the <a href="example/">example</a>.</p>
    <footer><a href="https://developer.puter.com" target="_blank" rel="noopener">Powered by Puter</a></footer>
  </main>
</body>
</html>
